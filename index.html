<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lagier's corner of the internet."
    />
    <title>Lagier — My socials</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas class="starfield" aria-hidden="true"></canvas>

    <main class="site-shell">
      <section class="window" aria-label="Personal portfolio">
        <header class="window-bar">
          <a class="wordmark" href="#top" aria-label="Back to top">Lagier</a>
          <div class="window-controls" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </header>

        <div class="window-body" id="top">
          <section class="intro">
            <p class="eyebrow">WebNovel Slop Consumer · since 2020</p>
            <h1>Hello<span class="accent">.</span></h1>
            <p class="intro-copy">
              PLEASEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE
              recommend me novels to read!!!! Q-Q
            </p>
          </section>

          <section class="work" aria-labelledby="work-title">
            <div class="section-heading">
              <p class="eyebrow" id="work-title">My Socials</p>
              <span class="section-rule"></span>
            </div>

            <div class="project-list">
              <button class="project project-dark discord-trigger" type="button" aria-expanded="false">
                <span class="project-number">01</span>
                <span class="project-name">Discord <span class="discord-username">justlagier</span></span>
                <span class="project-arrow" aria-hidden="true"></span>
              </button>
              <!-- Replace the Spotify URL below when your profile link is ready. -->
              <a class="project project-mid" href="https://open.spotify.com/user/your-profile" target="_blank" rel="noreferrer">
                <span class="project-number">02</span>
                <span class="project-name">Spotify</span>
                <span class="project-arrow" aria-hidden="true"></span>
              </a>
            </div>
          </section>

        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
